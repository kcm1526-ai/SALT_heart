# Thorax Segmentation Example Config
# Demonstrates grouping multiple structures into single classes

Target: Thorax_Segmentation
Task: ['thorax']
Phase: AP

FlipXYZ: [False, False, False]

# Group 1: Ribs - merge all ribs into "ribs" class
RibsName: 'ribs'
RibsList: [
  'rib_left_1', 'rib_left_2', 'rib_left_3', 'rib_left_4', 'rib_left_5', 'rib_left_6',
  'rib_left_7', 'rib_left_8', 'rib_left_9', 'rib_left_10', 'rib_left_11', 'rib_left_12',
  'rib_right_1', 'rib_right_2', 'rib_right_3', 'rib_right_4', 'rib_right_5', 'rib_right_6',
  'rib_right_7', 'rib_right_8', 'rib_right_9', 'rib_right_10', 'rib_right_11', 'rib_right_12'
]

# Group 2: Spine - merge all vertebrae into "spine" class
SpineName: 'spine'
SpineList: [
  'vertebrae_C1', 'vertebrae_C2', 'vertebrae_C3', 'vertebrae_C4', 'vertebrae_C5', 'vertebrae_C6', 'vertebrae_C7',
  'vertebrae_T1', 'vertebrae_T2', 'vertebrae_T3', 'vertebrae_T4', 'vertebrae_T5', 'vertebrae_T6',
  'vertebrae_T7', 'vertebrae_T8', 'vertebrae_T9', 'vertebrae_T10', 'vertebrae_T11', 'vertebrae_T12',
  'vertebrae_L1', 'vertebrae_L2', 'vertebrae_L3', 'vertebrae_L4', 'vertebrae_L5'
]

# Group 3: Heart - merge all heart structures into "heart" class
HeartName: 'heart'
HeartList: [
  'heart_myocardium',
  'heart_atrium_left',
  'heart_ventricle_left',
  'heart_atrium_right',
  'heart_ventricle_right'
]

# Group 4: Lungs - merge all lung lobes into "lungs" class
LungsName: 'lungs'
LungsList: [
  'lung_upper_lobe_left',
  'lung_lower_lobe_left',
  'lung_upper_lobe_right',
  'lung_middle_lobe_right',
  'lung_lower_lobe_right'
]

# Group 5: Aorta - merge aorta segments
AortaName: 'aorta'
AortaList: [
  'aorta_thoracica_pass_mediastinum',
  'aorta_thoracica_pass_pericardium',
  'aorta_abdominalis'
]

# Group 6: Scapulae
ScapulaeName: 'scapulae'
ScapulaeList: ['scapula_left', 'scapula_right']

# Group 7: Claviculae
ClaviculaeName: 'claviculae'
ClaviculaeList: ['clavicula_left', 'clavicula_right']

# Output classes - assigned values in order: ribs=1, spine=2, heart=3, lungs=4, aorta=5, scapulae=6, claviculae=7
TargetClass: [
  'ribs',
  'spine',
  'heart',
  'lungs',
  'aorta',
  'scapulae',
  'claviculae'
]

MatchCoordinate: True

PostProcess:
  RemoveSmallObjects: True
  KeepLargestN: 2
